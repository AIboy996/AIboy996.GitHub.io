plugins:
  - tags
  - mkdocs-cust
  - ai-summary:
      api: "deepseek"
      model: "deepseek-flash"
      ignore_code: true
      cache: true
      cache_dir: "./"
      prompt: "帮我把下面的内容总结为200字以内的摘要，使用和内容相同的语言。在输出的时候请不要出现连续换行，尽量形成一个完整的、逻辑通顺的段落。可以使用一些emoji来增加趣味性，如果有关键内容也可以添加锚点链接提供直达："
  # 视频插件
  - mkdocs-video:
      is_video: true
      video_muted: false
      video_controls: true
      video_autoplay: false
      css_style:
        width: "80%"
        display: block;
        margin-left: auto;
        margin-right: auto;
  # 图片放大插件
  - glightbox:
      effect: fade
      zoomable: true
      draggable: false
      skip_classes:
        - nonzoom
  ## 文章日期插件
  - git-revision-date-localized:
      timezone: Asia/Irkutsk
      enable_creation_date: true
      type: iso_datetime
  - minify:
      minify_html: true
  - rss:
      abstract_chars_count: 0
      match_path: "Blog/.*"
      categories:
        - tags