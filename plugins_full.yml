plugins:
  - tags
  - mkdocs-cust
  - ai-summary:
      api: "deepseek"
      model: "deepseek-flash"
      ignore_code: true
      cache: true
      cache_dir: "./"
      prompt: |
        请将[[BEGIN]]标记之后的内容总结为摘要，要求简洁、准确，并尽可能保留原文中的关键信息。请遵循以下要求：

        1. 信息取舍：优先保留核心观点、重要事实、关键结论，以及有趣、吸引人或具有代表性的内容。如果原文信息过多，可以适当取舍，但不要遗漏最重要的信息。
        2. 语言一致：使用与原文相同的语言进行总结，不要自行切换语言。
        3. 结构与可读性：优先整理成一个完整、连贯、逻辑通顺的段落，默认不要换行。如果内容确实适合分段，可以使用 Markdown 有序列表进行组织。
        4. 列表使用：如果需要罗列多个要点、事实或信息，请使用 Markdown 无序列表。
        5. Markdown：可以适当使用加粗、列表等 Markdown 语法，提升摘要的可读性，但不要过度格式化。
        6. Emoji：可以酌情使用少量合适的 Emoji 增加趣味性，但不要影响正式性和信息表达。
        7. 长度限制：最终摘要不得超过 300 字。

        请直接输出摘要，不要添加“摘要：”“总结：”等额外标题或说明。

        [[BEGIN]]

  # 视频插件
  - mkdocs-video:
      is_video: true
      video_muted: false
      video_controls: true
      video_autoplay: false
      css_style:
        width: "80%"
        display: block;
        margin-left: auto;
        margin-right: auto;
  # 图片放大插件
  - glightbox:
      effect: fade
      zoomable: true
      draggable: false
      skip_classes:
        - nonzoom
  ## 文章日期插件
  - git-revision-date-localized:
      timezone: Asia/Irkutsk
      enable_creation_date: true
      type: iso_datetime
  - minify:
      minify_html: true
  - rss:
      abstract_chars_count: 0
      match_path: "Blog/.*"
      categories:
        - tags